name = "lawan-kabut-asap"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Web statis (folder web/) dan API dilayani satu Worker: lawan-kabut-asap.<subdomain-akun>.workers.dev.
# Alamat resmi https://lawanasap.iaitbjambi.org disambungkan dari zona iaitbjambi.org (akun Cloudflare lain),
# jadi Worker melihat host workers.dev untuk kedua alamat; pengalihan dilakukan di web/index.html.
# Kode Worker jalan untuk /api/*, halaman (HTML awal untuk mesin pencari), dan sitemap; file web lain
# (CSS, JS, gambar, font) dilayani langsung tanpa memakai kuota request Worker.
[assets]
directory = "../web"
binding = "ASSETS"
run_worker_first = [
  "/api/*", "/", "/sitemap.xml", "/ruang", "/ruang/*", "/faskes", "/faskes/", "/oksigen", "/oksigen/",
  "/air-bersih", "/air-bersih/", "/ambulans", "/ambulans/", "/kontak", "/kontak/", "/edukasi", "/edukasi/",
  "/donasi", "/donasi/", "/info", "/info/", "/kontribusi", "/kontribusi/", "/panduan/*",
]

# Tarik data dari Apps Script tiap 5 menit.
[triggers]
crons = ["*/5 * * * *"]

# Buat dengan: npx wrangler kv namespace create DATA, lalu isi id di bawah.
[[kv_namespaces]]
binding = "DATA"
id = "39c064279718492f96c92af6096beb36"

[vars]
# "1" = /api/data memakai data contoh selama KV masih kosong (untuk demo). Set "0" sebelum peluncuran.
MODE_CONTOH = "1"
# Dasbor /admin: hanya email ini yang bisa masuk (boleh beberapa, dipisah koma).
ADMIN_EMAIL = "hello.iaitbjambi@gmail.com"
# Client ID OAuth Google (tipe Web application, origin https://lawanasap.iaitbjambi.org). Bukan rahasia.
ADMIN_CLIENT_ID = ""

# Rahasia, isi dengan `npx wrangler secret put <NAMA>` (jangan ditulis di sini):
#   APPS_SCRIPT_URL    URL web app Apps Script (berakhiran /exec)
#   APPS_SCRIPT_TOKEN  API_TOKEN dari Script Properties (dibuat otomatis oleh siapkan())
#   BOT_TOKEN          token acak untuk bot WhatsApp
#   ADMIN_SESSION_KEY  kunci acak penanda tangan cookie sesi dasbor admin
