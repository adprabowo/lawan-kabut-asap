name = "siaga-asap-jambi"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Tarik data dari Apps Script tiap 5 menit (Hari 2).
[triggers]
crons = ["*/5 * * * *"]

# Buat dengan: npx wrangler kv namespace create DATA, lalu isi id di bawah.
[[kv_namespaces]]
binding = "DATA"
id = "ISI_SETELAH_MEMBUAT_NAMESPACE"

[vars]
WEB_URL = "https://siaga-asap-jambi.pages.dev"

# Rahasia, isi dengan `npx wrangler secret put <NAMA>` (jangan ditulis di sini):
#   APPS_SCRIPT_URL    URL web app Apps Script (/exec)
#   APPS_SCRIPT_TOKEN  token rahasia yang sama dengan Script Property API_TOKEN
#   WA_TOKEN           token akses WhatsApp Cloud API
#   WA_PHONE_ID        Phone number ID bot
#   WA_APP_SECRET      App secret Meta untuk cek X-Hub-Signature-256
#   WA_VERIFY_TOKEN    token bebas untuk verifikasi webhook
